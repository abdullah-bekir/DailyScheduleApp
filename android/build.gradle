// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // Expo SDK 54 ships Kotlin 2.1.x. play-services-ads 25.x ships Kotlin 2.3
  // metadata and breaks :react-native-google-mobile-ads:compileReleaseKotlin.
  // Keep Ads SDK on 24.9.0 (matches react-native-google-mobile-ads@16.0.3).
  configurations.all {
    resolutionStrategy {
      force 'com.google.android.gms:play-services-ads:24.9.0'
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
